name: Crate Web Manifest — Health Check

on:
  schedule:
    # Weekly: Mondays 06:00 UTC. Adjust if Sonniss/IA prefer off-peak windows.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Least-privilege: contents:write to push the update branch,
# pull-requests:write to open the PR that carries it onto main,
# issues:write to open an issue when an entry newly fails (and as the
# fallback channel when Actions is not permitted to create PRs).
permissions:
  contents: write
  pull-requests: write
  issues: write

# Opt JavaScript-based actions into Node.js 24 ahead of GitHub's June 2026
# default-switch. Silences the deprecation warning on actions/checkout@v4
# and actions/setup-python@v5.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: web-manifest-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (latest)
        uses: actions/checkout@v4
        with:
          # Always check out the current tip of main, NOT the SHA that
          # triggered the workflow. Without this, a workflow_dispatch re-run
          # would check out the old SHA, then `git push` would be rejected
          # because main has moved on (e.g. from the previous run's own commit).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run health check
        id: health
        run: python scripts/health_check.py

      - name: Record result in the run summary
        env:
          SUMMARY: ${{ steps.health.outputs.summary }}
          CHANGED: ${{ steps.health.outputs.changed }}
          SUBSTANTIVE: ${{ steps.health.outputs.substantive }}
        run: |
          {
            echo "### Web manifest health check"
            echo
            echo "$SUMMARY"
            echo
            echo "- file bytes changed: \`$CHANGED\`"
            echo "- substantive change (status / http_code / note): \`$SUBSTANTIVE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Open a PR — never push to main.
      #
      # main is a protected branch (enforce_admins: true), so the previous
      # `git push` could not succeed by construction. It failed with
      # `GH006: Protected branch update failed` on 2026-07-27, 2026-08-03 and
      # 2026-08-10 — three consecutive scheduled runs reported as failures
      # even though the health check itself passed every time
      # ("Checked 24 entries: 24 ok, 0 non-ok. 0 newly failing.").
      #
      # Gated on `substantive`, not `changed`. `changed` is true on nearly
      # every run because last_checked/generated_at are rewritten
      # unconditionally; committing that weekly is churn that buries the runs
      # which actually found something. Freshness now lives in the run summary
      # above. Nothing consumes the tracked timestamps: the app decodes only
      # id/name/source/tier/license/category/content_types/size_bytes/notes
      # (App/Models/Production/WebManifest.swift) and ignores health_check
      # entirely.
      - name: Open PR with manifest updates
        if: steps.health.outputs.substantive == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env (not inline ${{ }} interpolation) so arbitrary
          # characters in probe output cannot alter the shell command.
          SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          # Unique per run: a fixed branch name would need a force-push to
          # reuse, and force-pushing is forbidden in this repo.
          BRANCH="chore/health-check-${DATE}-${GITHUB_RUN_ID}"

          git config user.name  "crate-web-bot"
          git config user.email "crate-web-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add crate_web_manifest.json
          git commit -m "chore(web): health-check $DATE" -m "$SUMMARY"
          git push origin "$BRANCH"

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="$(printf 'Scheduled health check found a status change.\n\n%s\n\nRun logs: %s\n' \
                  "$SUMMARY" "$RUN_URL")"

          # `gh pr create` fails when "Allow GitHub Actions to create and
          # approve pull requests" is off. It is off for this repo and for the
          # org (verified 2026-08-14 via
          # /repos/.../actions/permissions/workflow ->
          # can_approve_pull_request_reviews: false). Until an owner turns it
          # on, fall back to leaving the branch pushed and opening an issue
          # that links the compare view. Either way the run does NOT fail:
          # the health check passed, and a green check should mean that.
          if gh pr create --base main --head "$BRANCH" \
               --title "chore(web): health-check $DATE" --body "$BODY"; then
            echo "opened PR from $BRANCH"
          else
            echo "::warning::Could not open a PR (Actions may not be permitted to create PRs). Branch $BRANCH is pushed; opening an issue instead."
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            # No --label here on purpose: gh fails outright on a label that
            # does not exist, and this is already the degraded path.
            gh issue create \
              --title "Web manifest: health-check update needs a PR ($DATE)" \
              --body "$(printf 'The scheduled health check found a status change and pushed it to a branch, but could not open a PR itself.\n\n%s\n\nBranch: %s\nOpen a PR from it: %s\nRun logs: %s\n' \
                        "$SUMMARY" "$BRANCH" "$COMPARE" "$RUN_URL")"
          fi

      - name: Open issue for newly failing entries
        if: steps.health.outputs.new_failures != ''
        uses: actions/github-script@v7
        env:
          # Passed via env (not inline ${{ }} interpolation into JS source):
          # on 2026-07-06 a failure line containing a backtick broke the
          # template literal and crashed this step with a SyntaxError.
          NEW_FAILURES: ${{ steps.health.outputs.new_failures }}
        with:
          script: |
            const failures = process.env.NEW_FAILURES;
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Web manifest: newly failing entries (${today})`,
              body:  [
                `The scheduled health check detected entries that transitioned`,
                `from \`ok\` → failing in this run.`,
                ``,
                failures,
                ``,
                `[View run logs](${runUrl})`,
              ].join('\n'),
              labels: ['web-manifest', 'health-check'],
            });
