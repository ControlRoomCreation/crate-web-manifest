name: Crate Web Manifest — Health Check

on:
  schedule:
    # Weekly: Mondays 06:00 UTC. Adjust if Sonniss/IA prefer off-peak windows.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Least-privilege: contents:write to commit manifest updates,
# issues:write to open an issue when an entry newly fails.
permissions:
  contents: write
  issues: write

# Opt JavaScript-based actions into Node.js 24 ahead of GitHub's June 2026
# default-switch. Silences the deprecation warning on actions/checkout@v4
# and actions/setup-python@v5.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: web-manifest-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (latest)
        uses: actions/checkout@v4
        with:
          # Always check out the current tip of main, NOT the SHA that
          # triggered the workflow. Without this, a workflow_dispatch re-run
          # would check out the old SHA, then `git push` would be rejected
          # because main has moved on (e.g. from the previous run's own commit).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run health check
        id: health
        run: python scripts/health_check.py

      - name: Commit manifest updates
        if: steps.health.outputs.changed == 'true'
        env:
          # Passed via env (not inline ${{ }} interpolation) so arbitrary
          # characters in probe output cannot alter the shell command.
          SUMMARY: ${{ steps.health.outputs.summary }}
        run: |
          git config user.name  "crate-web-bot"
          git config user.email "crate-web-bot@users.noreply.github.com"
          git add crate_web_manifest.json
          git commit -m "chore(web): health-check $(date -u +%Y-%m-%d)" \
                     -m "$SUMMARY"
          git push

      - name: Open issue for newly failing entries
        if: steps.health.outputs.new_failures != ''
        uses: actions/github-script@v7
        env:
          # Passed via env (not inline ${{ }} interpolation into JS source):
          # on 2026-07-06 a failure line containing a backtick broke the
          # template literal and crashed this step with a SyntaxError.
          NEW_FAILURES: ${{ steps.health.outputs.new_failures }}
        with:
          script: |
            const failures = process.env.NEW_FAILURES;
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Web manifest: newly failing entries (${today})`,
              body:  [
                `The scheduled health check detected entries that transitioned`,
                `from \`ok\` → failing in this run.`,
                ``,
                failures,
                ``,
                `[View run logs](${runUrl})`,
              ].join('\n'),
              labels: ['web-manifest', 'health-check'],
            });
